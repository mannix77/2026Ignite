# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Only path instructions are set here; every other review setting keeps its default.
# They encode what reviews of this repo kept finding (see CLAUDE.md).
reviews:
  path_instructions:
    - path: "tests/**"
      instructions: |
        Check that each new or changed test can only pass for the right reason:
        - it asserts the outcome (the returned value, the written file, the served response), not just that a call happened;
        - an absence check ("X stays empty") is paired with a check that the intended effect happened;
        - a precondition the test relies on is asserted in the same test;
        - every output of a multi-output function is asserted;
        - expected values come from the source of truth (disk, the code's own fetch list, literals), not rebuilt with the code's rule;
        - a parity/differential test also asserts the expected result, not only that two implementations agree;
        - a tautological test is fixed with an independent expected value, not a weaker assertion;
        - thresholds are pinned on both sides, and isolation is tested in both directions;
        - no dependence on the wall clock or the machine's time zone;
        - every subprocess or network call has a timeout;
        - Python fixtures are shared through mixins, not by subclassing a concrete TestCase.
        When one instance of a problem is flagged, list the other instances in the same file or suite.
    - path: "{scripts/**,assets/js/**}"
      instructions: |
        Identifiers from feeds, backups or storage must go through one validating helper (type, trimmed, non-blank) and lookups must use exact keys (Object.hasOwn), not truthiness or regex over source.
        A guard's threshold must not be adjustable by the data it checks.
        Untrusted records are skipped and counted, never fatal; a mostly-junk feed must be refused and the last good data kept.
        If assets/js/live.js and scripts/sync.py normalize or diff the catalog, check both changed together.
    - path: ".github/workflows/**"
      instructions: |
        Pushes to main must retry a lost race (both sync workflows push to the same branch). Stage files explicitly; a fallback such as `git add -A <dir>` must not be reachable in the normal case.

name: Tests

# The whole suite (`npm test`: the JS tests and Python `unittest discover`) on every pull request
# and every push to main, so a failure shows on the pull request and not first in the next
# scheduled sync. The catalog commits the sync workflows push do not start it (a push made with
# the workflow token starts no workflows); the catalog sync runs the same suite before it syncs.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The same versions the sync runs on (tests/test_workflows.py keeps them equal).
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Run tests
        run: npm test

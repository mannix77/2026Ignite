name: Capture room occupancy

# During Ignite (Nov 17-20), every 10 minutes between 07:00 and 19:59 Pacific: read the official
# map's room-occupancy feed into data/ignite2026/occupancy.json (scripts/occupancy.py), push it,
# and ask sync.yml to redeploy Pages (a push made with the workflow token triggers nothing on its
# own, and sync.yml ignores data/** pushes anyway). Spec: specs/features/room-occupancy.feature
on:
  schedule:
    - cron: "*/10 15-23 17-20 11 *"   # 07:00-15:59 PT, Nov 17-20
    - cron: "*/10 0-3 18-21 11 *"     # 16:00-19:59 PT, Nov 17-20 (the next UTC day)
  workflow_dispatch:

permissions:
  contents: read

# A run still going when the next one starts is cancelled: a healthy run takes under a minute.
concurrency:
  group: occupancy
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write   # commit the occupancy file
      actions: write    # dispatch sync.yml to redeploy Pages
    steps:
      - name: Only during the event
        id: window
        run: |
          d=$(date -u +%Y%m%d)
          if [ "$d" -lt 20261117 ] || [ "$d" -gt 20261121 ]; then
            echo "Outside Ignite 2026; nothing to capture."
            echo "active=false" >> "$GITHUB_OUTPUT"
          else
            echo "active=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.window.outputs.active == 'true'
        with:
          # The branch tip, not the trigger's commit: a run queued behind another would start
          # from before that run's push and its commit would conflict.
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: steps.window.outputs.active == 'true'
        with:
          python-version: "3.12"

      - name: Test the capture
        if: steps.window.outputs.active == 'true'
        run: python3 -m unittest tests.test_occupancy

      - name: Capture the feed
        id: capture
        if: steps.window.outputs.active == 'true'
        # An unusable feed keeps the last file (exit 3) and this run ends quietly: the next one tries again.
        continue-on-error: true
        timeout-minutes: 2
        run: python3 scripts/occupancy.py

      - name: Commit the occupancy file
        id: commit
        if: steps.window.outputs.active == 'true' && steps.capture.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/ignite2026/occupancy.json
          if git diff --cached --quiet; then
            echo "No change."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Room occupancy $(date -u +%Y-%m-%dT%H:%MZ)"
          # The sync workflows push to the same branch; retry a push that loses the race.
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && { echo "pushed=true" >> "$GITHUB_OUTPUT"; exit 0; }
            git rebase --abort 2>/dev/null || true   # a conflict must not leave the next try mid-rebase
            sleep $((i * 10))
          done
          echo "::warning::Could not push the occupancy file; the next capture tries again"
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Redeploy the site
        if: steps.commit.outputs.pushed == 'true'
        continue-on-error: true   # the next scheduled Ignite sync deploys it anyway
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sync.yml --ref main

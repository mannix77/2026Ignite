name: Sync re:Invent catalog

# A separate workflow so a re:Invent failure can never block the Ignite sync or the Pages
# deploy (sync.yml). It commits only when the catalog changed, then asks sync.yml to
# redeploy: pushes made with the workflow token don't trigger workflows on their own.
on:
  schedule:
    - cron: "41 */6 * 10 *"          # every 6 hours in October
    - cron: "41 */6 1-28 11 *"       # ... through Nov 28
    - cron: "41 * 29,30 11 *"        # hourly from Nov 29 (UTC) ...
    - cron: "41 * 1-4 12 *"          # ... through the event (Nov 30 - Dec 4)
  workflow_dispatch:

permissions:
  contents: read

# Its own group: sharing "sync" could replace a pending Ignite run. The data folders don't
# overlap, so racing pushes are settled by rebasing.
concurrency:
  group: reinvent-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # commit catalog changes
      issues: write     # post change summaries
      actions: write    # dispatch sync.yml to redeploy Pages
    outputs:
      outcome: ${{ steps.sync.outcome }}
      notify: ${{ steps.notify.outcome }}
      error: ${{ steps.why.outputs.error }}
      redeploy: ${{ steps.redeploy.outcome }}
    steps:
      - name: Stop after the event
        id: window
        run: |
          if [ "$(date -u +%Y%m%d)" -gt 20261205 ]; then
            echo "re:Invent 2026 is over; nothing to sync."
            echo "active=false" >> "$GITHUB_OUTPUT"
          else
            echo "active=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.window.outputs.active == 'true'
        with:
          # The branch tip, not the trigger's commit: a run queued behind another would start
          # from before that run's push and its catalog commit would conflict.
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: steps.window.outputs.active == 'true'
        with:
          python-version: "3.12"

      - name: Test the importer
        if: steps.window.outputs.active == 'true'
        run: python3 -m unittest tests.test_import_reinvent

      - name: Fetch and import the catalog
        id: sync
        if: steps.window.outputs.active == 'true'
        # A failed fetch (or one under 90% of the last count) keeps the last good data;
        # the "report" job below fails the run so GitHub notifies you.
        continue-on-error: true
        timeout-minutes: 8
        run: python3 scripts/import_reinvent.py --fetch --summary-out "$RUNNER_TEMP/summary.md"

      # The reason a failed sync gives (meta.json isn't committed), for the production issue.
      - name: Read why the sync failed
        id: why
        if: steps.sync.outcome == 'failure'
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json
          try:
              e = json.load(open("data/reinvent2026/meta.json", encoding="utf-8")).get("error") or ""
          except Exception:
              e = ""
          print("error=" + " ".join(str(e).split())[:1000])
          PY

      # Same order as the Ignite job (specs/features/change-notices.feature): queue the summary in
      # data/reinvent2026/pending-summary.md, push it with the catalog, only then post it, and push
      # the cleared file. A failed push posts nothing; a failed post stays pending for the next run;
      # a summary already on the issue is never posted twice.
      - name: Queue the change summary
        if: steps.window.outputs.active == 'true' && steps.sync.outputs.changed == 'true'
        run: python3 scripts/post_summary.py stage --pending data/reinvent2026/pending-summary.md --new "$RUNNER_TEMP/summary.md" --id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

      # Commit only on changes. A fresh snapshot differs on every fetch (fetchedAt, raw
      # fields the app ignores), so it's kept only when the normalized catalog changed.
      - name: Commit catalog changes
        id: commit
        if: steps.window.outputs.active == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          d=data/reinvent2026
          if git diff --quiet -- "$d/sessions.json" "$d/changes.json"; then
            git checkout -- "$d/source" 2>/dev/null || true
          fi
          git add -A -- "$d/sessions.json" "$d/changes.json" "$d/changelog.md" "$d/source"
          # The pending summary can be new, changed, deleted or absent; only an absent one is skipped.
          if [ -e "$d/pending-summary.md" ] || git ls-files --error-unmatch -- "$d/pending-summary.md" >/dev/null 2>&1; then
            git add -A -- "$d/pending-summary.md"
          fi
          if git diff --cached --quiet; then
            echo "No catalog changes."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "re:Invent catalog update $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && { echo "pushed=true" >> "$GITHUB_OUTPUT"; exit 0; }
            git rebase --abort 2>/dev/null || true   # a conflict must not leave the next try mid-rebase
            sleep $((i * 10))
          done
          echo "::error::Could not push the re:Invent catalog update"
          exit 1

      - name: Post the change summary to the tracking issue
        id: notify
        if: steps.window.outputs.active == 'true' && hashFiles('data/reinvent2026/pending-summary.md') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          LOG_URL: ${{ github.server_url }}/${{ github.repository }}/blob/main/data/reinvent2026/changelog.md
        run: |
          printf '_Full history: [changelog.md](%s)_\n' "$LOG_URL" > "$RUNNER_TEMP/footer.md"
          python3 scripts/post_summary.py post --pending data/reinvent2026/pending-summary.md \
            --current "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --label reinvent-changes --color ff9900 \
            --description "re:Invent catalog change log" --title "re:Invent 2026 catalog changes" \
            --footer "$RUNNER_TEMP/footer.md" \
            --issue-body "The scheduled re:Invent sync adds a comment here whenever the session catalog changes (new, removed, retimed or moved sessions). Subscribe to this issue to get notified. The full history is in data/reinvent2026/changelog.md."

      # Push what was posted (the file is cleared or shorter). If this push fails nothing is lost:
      # the next run finds the summary already on the issue and clears it then.
      - name: Commit the cleared summary
        if: steps.notify.outcome != 'skipped'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          d=data/reinvent2026
          git add -A -- "$d/pending-summary.md"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Clear posted re:Invent change summary"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            git rebase --abort 2>/dev/null || true   # a conflict must not leave the next try mid-rebase
            sleep $((i * 10))
          done
          echo "::warning::Could not push the cleared summary; the next run clears it without posting it again"
          exit 1

      - name: Redeploy the site
        id: redeploy
        if: steps.commit.outputs.pushed == 'true'
        continue-on-error: true   # the next scheduled Ignite run deploys it anyway
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sync.yml --ref main

  # One GitHub issue per production problem (scripts/prod_issue.py): a new problem opens an
  # issue labelled "production" and fails the run once; a repeat only updates that issue; a
  # successful run closes this workflow's open issues. Spec: specs/features/production-issues.feature
  report:
    needs: sync
    if: always() && needs.sync.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: scripts/prod_issue.py
          sparse-checkout-cone-mode: false

      - name: Open, update or close the production issue
        id: prod
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_JOB: ${{ needs.sync.result }}
          SYNC: ${{ needs.sync.outputs.outcome }}
          NOTIFY: ${{ needs.sync.outputs.notify }}
          DEPLOY: ${{ needs.sync.outputs.redeploy }}   # this workflow's deploy is asking sync.yml to redeploy
          ERROR: ${{ needs.sync.outputs.error }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -o pipefail
          report() {
            printf '%s\n' "$3" > "$RUNNER_TEMP/problem.txt"
            python3 scripts/prod_issue.py report --workflow "$WORKFLOW" --kind "$1" --title "$2" \
              --message-file "$RUNNER_TEMP/problem.txt" --run-url "$RUN_URL"
          }
          if [ "$SYNC_JOB" = "failure" ]; then
            report job-failed "The sync job failed" "A step of the sync job failed (tests, commit or site build); the site keeps the last deploy. See the run log for the failing step."
          elif [ "$SYNC" = "failure" ]; then
            report sync-refused "The catalog sync failed or was refused" "${ERROR:-The catalog sync failed; see the 'Fetch and import the catalog' step log.} The site keeps the last good data."
          elif [ "$NOTIFY" = "failure" ]; then
            report notify-failed "The change summary could not be posted" "The catalog changed but the issue comment could not be posted; it is kept in data/reinvent2026/pending-summary.md and retried next run."
          elif [ "$DEPLOY" = "failure" ]; then
            report deploy-failed "The site redeploy request failed" "The catalog was saved, but asking sync.yml to redeploy the site failed; the site shows the new catalog after the next scheduled Ignite run. See the 'Redeploy the site' step log."
          else
            python3 scripts/prod_issue.py resolve --workflow "$WORKFLOW" --run-url "$RUN_URL"
            exit 0
          fi | tee "$RUNNER_TEMP/result.txt"
          echo "result=$(tail -n 1 "$RUNNER_TEMP/result.txt")" >> "$GITHUB_OUTPUT"

      - name: Fail the run when a new production problem appears
        if: steps.prod.outputs.result == 'opened'
        run: |
          echo "::error::A new production problem was found and filed as a GitHub issue labelled 'production'."
          exit 1

      - name: Note a repeat of a known problem
        if: steps.prod.outputs.result == 'updated'
        run: echo "::warning::A known production problem happened again; its GitHub issue was updated."

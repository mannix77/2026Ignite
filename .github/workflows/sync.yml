name: Sync Ignite catalog & deploy

on:
  schedule:
    - cron: "17 */2 * * *"          # every 2 hours, year-round
    - cron: "13,43 * 20-31 10 *"    # twice an hour from Oct 20 (the schedule is expected ~Oct 26-30)
    - cron: "13,43 * 1-21 11 *"     # twice an hour through the event (Nov 17-20)
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["data/**"]

# Least privilege: read-only by default; each job asks for what it needs.
permissions:
  contents: read

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # commit catalog snapshots
      issues: write     # post change summaries
      pages: read       # configure-pages reads the site settings
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
      outcome: ${{ steps.sync.outcome }}
      notify: ${{ steps.notify.outcome }}
      error: ${{ steps.why.outputs.error }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Not the trigger's commit: a run that queued behind another (same concurrency group)
          # would sync from before that run's push, and its catalog commit would then conflict.
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Run tests
        run: |
          node tests/planner.test.js
          node tests/robustness.test.js
          node tests/profile.test.js
          node tests/catalog.test.js
          node tests/store.test.js
          node tests/instance.test.js
          node tests/health.test.js
          python3 -m unittest discover -s tests

      - name: Sync the catalog
        id: sync
        # A failed fetch keeps the last good data; the app shows the error from data/meta.json,
        # and the "report" job below fails the run so GitHub notifies you.
        continue-on-error: true
        timeout-minutes: 6
        run: python3 scripts/sync.py --summary-out "$RUNNER_TEMP/summary.md"

      # The reason a failed sync gives (meta.json isn't committed), for the production issue.
      - name: Read why the sync failed
        id: why
        if: steps.sync.outcome == 'failure'
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json
          try:
              e = json.load(open("data/ignite2026/meta.json", encoding="utf-8")).get("error") or ""
          except Exception:
              e = ""
          print("error=" + " ".join(str(e).split())[:1000])
          PY

      # The summary is announced only after the catalog is pushed (specs/features/change-notices.feature):
      # it is queued in data/ignite2026/pending-summary.md, committed and pushed with the catalog,
      # posted, and the cleared file is pushed again. A failed push posts nothing; a failed post
      # stays pending for the next run; a summary already on the issue is never posted twice.
      - name: Queue the change summary
        if: steps.sync.outputs.changed == 'true'
        run: python3 scripts/post_summary.py stage --pending data/ignite2026/pending-summary.md --new "$RUNNER_TEMP/summary.md" --id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

      - name: Commit catalog changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          d=data/ignite2026
          git add -A -- "$d/sessions.json" "$d/changes.json"
          # The pending summary can be new, changed, deleted or absent; only an absent one is skipped.
          if [ -e "$d/pending-summary.md" ] || git ls-files --error-unmatch -- "$d/pending-summary.md" >/dev/null 2>&1; then
            git add -A -- "$d/pending-summary.md"
          fi
          if git diff --cached --quiet; then
            echo "No catalog changes."
            exit 0
          fi
          git commit -m "Catalog update $(date -u +%Y-%m-%dT%H:%MZ)"
          # The re:Invent workflow pushes to the same branch; retry a push that loses the race.
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            git rebase --abort 2>/dev/null || true   # a conflict must not leave the next try mid-rebase
            sleep $((i * 10))
          done
          echo "::error::Could not push the Ignite catalog update"
          exit 1

      - name: Post the change summary to the tracking issue
        id: notify
        if: hashFiles('data/ignite2026/pending-summary.md') != ''
        continue-on-error: true   # never block the deploy on a GitHub API hiccup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/post_summary.py post --pending data/ignite2026/pending-summary.md \
            --current "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --label ignite-changes --color 0f766e \
            --description "Ignite catalog change log" --title "Ignite 2026 catalog changes" \
            --issue-body "The scheduled sync adds a comment here whenever the Ignite session catalog changes (new, removed, retimed or moved sessions, and when dates/rooms are published). Subscribe to this issue to get notified. Starred (⭐) entries are on your watchlist (data/ignite2026/watchlist.json)."

      # Push what was posted (the file is cleared or shorter). If this push fails nothing is lost:
      # the next run finds the summary already on the issue and clears it then.
      - name: Commit the cleared summary
        if: steps.notify.outcome != 'skipped'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          d=data/ignite2026
          git add -A -- "$d/pending-summary.md"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Clear posted change summary"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            git rebase --abort 2>/dev/null || true   # a conflict must not leave the next try mid-rebase
            sleep $((i * 10))
          done
          echo "::warning::Could not push the cleared summary; the next run clears it without posting it again"
          exit 1

      - name: Stamp the app version for offline caching
        run: |
          # Colleague copies (instances/<name>/) are stamped from these files below, so their own
          # files count too: a change only to instances/gino/conference must still update Gino's copy.
          v=$({ cat index.html manifest.webmanifest assets/css/*.css assets/js/*.js assets/icons/*
                [ -d instances ] && find instances -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum  # one "hash  path" line per file
              } | sha256sum | cut -c1-12)
          sed -i "s/const VERSION = 'ignite26-dev';/const VERSION = 'ignite26-$v';/" sw.js
          grep -q "ignite26-$v" sw.js

      # App copies cached before the catalog moved to data/ignite2026/ still ask for the old
      # paths until they pick up the new version; serve them the Ignite data there too.
      - name: Keep the legacy data paths working
        run: cp data/ignite2026/sessions.json data/ignite2026/changes.json data/ignite2026/meta.json data/

      # The re:Invent source snapshot (~5 MB) is the importer's input; the app never reads it.
      # Removed after the commit step, before the site (and each colleague copy) is assembled.
      - name: Leave the re:Invent source snapshot out of the site
        run: rm -rf data/reinvent2026/source

      # One extra copy of the site per instances/<name>/ (e.g. /gino/): same catalogs, its own
      # picks (storage is namespaced), no pre-loaded favorites unless the folder provides them.
      - name: Publish copies for colleagues
        run: |
          for dir in instances/*/; do
            [ -d "$dir" ] || continue
            name=$(basename "$dir")
            case "$name" in *[!a-z0-9-]*) echo "::error::instance folder '$name' must be lowercase letters, digits or -"; exit 1;; esac
            rm -rf "$name" && mkdir -p "$name"
            cp -R index.html manifest.webmanifest sw.js assets data "$name/"
            find "$name/data" \( -name favorites.json -o -name profile.json \) -delete
            [ -d "$dir/data" ] && cp -R "$dir/data/." "$name/data/"
            python3 scripts/instance_llms.py llms.txt "$name/llms.txt" "$name"   # the AI guide, with this copy's links
            sed -i "s|<meta name=\"planner-instance\" content=\"\">|<meta name=\"planner-instance\" content=\"$name\">|" "$name/index.html"
            grep -q "content=\"$name\"" "$name/index.html"
            conf=""
            if [ -f "$dir/conference" ]; then
              conf=$(tr -d '[:space:]' < "$dir/conference")
              node scripts/conference_id.js "$conf" || { echo "::error::instances/$name/conference names an unknown conference '$conf'"; exit 1; }
              sed -i "s|<meta name=\"planner-default-conference\" content=\"\">|<meta name=\"planner-default-conference\" content=\"$conf\">|" "$name/index.html"
              grep -q "planner-default-conference\" content=\"$conf\"" "$name/index.html"
            fi
            label="$(printf '%s' "${name:0:1}" | tr a-z A-Z)${name:1}"
            sed -i "s|\"name\": \"Conference Planner\"|\"name\": \"Conference Planner ($label)\"|; s|\"short_name\": \"Planner\"|\"short_name\": \"Planner $label\"|" "$name/manifest.webmanifest"
            echo "published /$name/ ($(find "$name/data" -name favorites.json | wc -l | tr -d ' ') favorites file(s), opens on ${conf:-the default conference})"
          done

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: .

  deploy:
    needs: sync
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  # One GitHub issue per production problem (scripts/prod_issue.py): a new problem opens an
  # issue labelled "production" and fails the run once; a repeat only updates that issue; a
  # successful run closes this workflow's open issues. Spec: specs/features/production-issues.feature
  report:
    needs: [sync, deploy]
    if: always() && needs.sync.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: scripts/prod_issue.py
          sparse-checkout-cone-mode: false

      - name: Open, update or close the production issue
        id: prod
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_JOB: ${{ needs.sync.result }}
          SYNC: ${{ needs.sync.outputs.outcome }}
          NOTIFY: ${{ needs.sync.outputs.notify }}
          DEPLOY: ${{ needs.deploy.result }}
          ERROR: ${{ needs.sync.outputs.error }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -o pipefail
          report() {
            printf '%s\n' "$3" > "$RUNNER_TEMP/problem.txt"
            python3 scripts/prod_issue.py report --workflow "$WORKFLOW" --kind "$1" --title "$2" \
              --message-file "$RUNNER_TEMP/problem.txt" --run-url "$RUN_URL"
          }
          if [ "$SYNC_JOB" = "failure" ]; then
            report job-failed "The sync job failed" "A step of the sync job failed (tests, commit or site build); the site keeps the last deploy. See the run log for the failing step."
          elif [ "$SYNC" = "failure" ]; then
            report sync-refused "The catalog sync failed or was refused" "${ERROR:-The catalog sync failed; see the 'Sync the catalog' step log.} The site keeps the last good data."
          elif [ "$NOTIFY" = "failure" ]; then
            report notify-failed "The change summary could not be posted" "The catalog changed but the issue comment could not be posted; it is kept in data/ignite2026/pending-summary.md and retried next run."
          elif [ "$DEPLOY" = "failure" ]; then
            report deploy-failed "The site deploy failed" "Publishing to GitHub Pages failed; the site keeps the previous version. See the deploy job log."
          else
            python3 scripts/prod_issue.py resolve --workflow "$WORKFLOW" --run-url "$RUN_URL"
            exit 0
          fi | tee "$RUNNER_TEMP/result.txt"
          echo "result=$(tail -n 1 "$RUNNER_TEMP/result.txt")" >> "$GITHUB_OUTPUT"

      - name: Fail the run when a new production problem appears
        if: steps.prod.outputs.result == 'opened'
        run: |
          echo "::error::A new production problem was found and filed as a GitHub issue labelled 'production'."
          exit 1

      - name: Note a repeat of a known problem
        if: steps.prod.outputs.result == 'updated'
        run: echo "::warning::A known production problem happened again; its GitHub issue was updated."

name: Sync Ignite catalog & deploy

on:
  schedule:
    - cron: "17 */2 * * *"          # every 2 hours, year-round
    - cron: "13,43 * 20-31 10 *"    # twice an hour from Oct 20 (the schedule is expected ~Oct 26-30)
    - cron: "13,43 * 1-21 11 *"     # twice an hour through the event (Nov 17-20)
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["data/**"]

# Least privilege: read-only by default; each job asks for what it needs.
permissions:
  contents: read

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # commit catalog snapshots
      issues: write     # post change summaries
      pages: read       # configure-pages reads the site settings
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
      outcome: ${{ steps.sync.outcome }}
      notify: ${{ steps.notify.outcome }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Run tests
        run: |
          node tests/planner.test.js
          node tests/robustness.test.js
          node tests/profile.test.js
          node tests/catalog.test.js
          node tests/store.test.js
          node tests/instance.test.js
          python3 -m unittest discover -s tests

      - name: Sync the catalog
        id: sync
        # A failed fetch keeps the last good data; the app shows the error from data/meta.json,
        # and the "report" job below fails the run so GitHub notifies you.
        continue-on-error: true
        timeout-minutes: 6
        run: python3 scripts/sync.py --summary-out "$RUNNER_TEMP/summary.md"

      # Posts this run's summary and any summary a previous run failed to post. A failure
      # leaves the summary in data/ignite2026/pending-summary.md (committed below) so the
      # notification is retried next time instead of being lost.
      - name: Post the change summary to the tracking issue
        id: notify
        if: steps.sync.outputs.changed == 'true' || hashFiles('data/ignite2026/pending-summary.md') != ''
        continue-on-error: true   # never block the deploy on a GitHub API hiccup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          pending=data/ignite2026/pending-summary.md
          new="$RUNNER_TEMP/summary.md"
          body="$RUNNER_TEMP/post.md"
          : > "$body"
          [ -s "$pending" ] && { echo "_Delayed summary from an earlier sync:_" >> "$body"; cat "$pending" >> "$body"; echo >> "$body"; }
          [ -s "$new" ] && cat "$new" >> "$body"
          [ -s "$body" ] || exit 0
          post() {
            gh label create ignite-changes --color 0f766e --description "Ignite catalog change log" 2>/dev/null || true
            num=$(gh issue list --label ignite-changes --state open --limit 1 --json number --jq '.[0].number // empty')
            if [ -z "$num" ]; then
              url=$(gh issue create --label ignite-changes --title "Ignite 2026 catalog changes" \
                --body "The scheduled sync adds a comment here whenever the Ignite session catalog changes (new, removed, retimed or moved sessions, and when dates/rooms are published). Subscribe to this issue to get notified. Starred (⭐) entries are on your watchlist (data/ignite2026/watchlist.json).")
              num="${url##*/}"
            fi
            gh issue comment "$num" --body-file "$body"
          }
          if post; then
            rm -f "$pending"
          else
            cp "$body" "$pending"
            exit 1
          fi

      - name: Commit catalog changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          d=data/ignite2026
          git add -A -- "$d/sessions.json" "$d/changes.json"
          # The pending summary can be new, changed, deleted or absent; only an absent one is skipped.
          if [ -e "$d/pending-summary.md" ] || git ls-files --error-unmatch -- "$d/pending-summary.md" >/dev/null 2>&1; then
            git add -A -- "$d/pending-summary.md"
          fi
          if git diff --cached --quiet; then
            echo "No catalog changes."
            exit 0
          fi
          git commit -m "Catalog update $(date -u +%Y-%m-%dT%H:%MZ)"
          # The re:Invent workflow pushes to the same branch; retry a push that loses the race.
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((i * 10))
          done
          echo "::error::Could not push the Ignite catalog update"
          exit 1

      - name: Stamp the app version for offline caching
        run: |
          # Colleague copies (instances/<name>/) are stamped from these files below, so their own
          # files count too: a change only to instances/gino/conference must still update Gino's copy.
          v=$({ cat index.html manifest.webmanifest assets/css/*.css assets/js/*.js assets/icons/*
                [ -d instances ] && find instances -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum  # one "hash  path" line per file
              } | sha256sum | cut -c1-12)
          sed -i "s/const VERSION = 'ignite26-dev';/const VERSION = 'ignite26-$v';/" sw.js
          grep -q "ignite26-$v" sw.js

      # App copies cached before the catalog moved to data/ignite2026/ still ask for the old
      # paths until they pick up the new version; serve them the Ignite data there too.
      - name: Keep the legacy data paths working
        run: cp data/ignite2026/sessions.json data/ignite2026/changes.json data/ignite2026/meta.json data/

      # The re:Invent source snapshot (~5 MB) is the importer's input; the app never reads it.
      # Removed after the commit step, before the site (and each colleague copy) is assembled.
      - name: Leave the re:Invent source snapshot out of the site
        run: rm -rf data/reinvent2026/source

      # One extra copy of the site per instances/<name>/ (e.g. /gino/): same catalogs, its own
      # picks (storage is namespaced), no pre-loaded favorites unless the folder provides them.
      - name: Publish copies for colleagues
        run: |
          for dir in instances/*/; do
            [ -d "$dir" ] || continue
            name=$(basename "$dir")
            case "$name" in *[!a-z0-9-]*) echo "::error::instance folder '$name' must be lowercase letters, digits or -"; exit 1;; esac
            rm -rf "$name" && mkdir -p "$name"
            cp -R index.html manifest.webmanifest sw.js assets data "$name/"
            find "$name/data" \( -name favorites.json -o -name profile.json \) -delete
            [ -d "$dir/data" ] && cp -R "$dir/data/." "$name/data/"
            sed -i "s|<meta name=\"planner-instance\" content=\"\">|<meta name=\"planner-instance\" content=\"$name\">|" "$name/index.html"
            grep -q "content=\"$name\"" "$name/index.html"
            conf=""
            if [ -f "$dir/conference" ]; then
              conf=$(tr -d '[:space:]' < "$dir/conference")
              node scripts/conference_id.js "$conf" || { echo "::error::instances/$name/conference names an unknown conference '$conf'"; exit 1; }
              sed -i "s|<meta name=\"planner-default-conference\" content=\"\">|<meta name=\"planner-default-conference\" content=\"$conf\">|" "$name/index.html"
              grep -q "planner-default-conference\" content=\"$conf\"" "$name/index.html"
            fi
            label="$(printf '%s' "${name:0:1}" | tr a-z A-Z)${name:1}"
            sed -i "s|\"name\": \"Conference Planner\"|\"name\": \"Conference Planner ($label)\"|; s|\"short_name\": \"Planner\"|\"short_name\": \"Planner $label\"|" "$name/manifest.webmanifest"
            echo "published /$name/ ($(find "$name/data" -name favorites.json | wc -l | tr -d ' ') favorites file(s), opens on ${conf:-the default conference})"
          done

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: .

  deploy:
    needs: sync
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  report:
    needs: [sync, deploy]
    if: always() && (needs.sync.outputs.outcome == 'failure' || needs.sync.outputs.notify == 'failure')
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Sync or notification failed
        run: |
          if [ "${{ needs.sync.outputs.outcome }}" = "failure" ]; then
            echo "::error::The catalog sync failed; the site is serving the last good data. See the 'Sync the catalog' step log."
          else
            echo "::error::The catalog changed but the issue comment could not be posted; it is kept in data/ignite2026/pending-summary.md and will be retried next run."
          fi
          exit 1

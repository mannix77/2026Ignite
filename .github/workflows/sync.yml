name: Sync Ignite catalog & deploy

on:
  schedule:
    - cron: "17 */2 * * *"        # every 2 hours, year-round
    - cron: "*/30 * 20-31 10 *"   # every 30 min from Oct 20 (the schedule is expected ~Oct 26-30)
    - cron: "*/30 * 1-21 11 *"    # every 30 min through the event (Nov 17-20)
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["data/**"]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run tests
        run: |
          node tests/planner.test.js
          python3 -m unittest discover -s tests

      - name: Sync the catalog
        id: sync
        # A failed fetch keeps the last good data; the app shows the error from data/meta.json.
        continue-on-error: true
        run: python3 scripts/sync.py --summary-out "$RUNNER_TEMP/summary.md"

      - name: Commit catalog changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sessions.json data/changes.json
          if git diff --cached --quiet; then
            echo "No catalog changes."
          else
            git commit -m "Catalog update $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash
            git push
          fi

      - name: Post the change summary to the tracking issue
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create ignite-changes --color 0f766e --description "Ignite catalog change log" 2>/dev/null || true
          num=$(gh issue list --label ignite-changes --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -z "$num" ]; then
            url=$(gh issue create --label ignite-changes --title "Ignite 2026 catalog changes" \
              --body "The scheduled sync adds a comment here whenever the Ignite session catalog changes (new, removed, retimed or moved sessions, and when dates/rooms are published). Subscribe to this issue to get notified. Starred (⭐) entries are on your watchlist (data/watchlist.json).")
            num="${url##*/}"
          fi
          gh issue comment "$num" --body-file "$RUNNER_TEMP/summary.md"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: sync
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: Publish the app's support and privacy pages

# The App Store listing for Session Planner links to
#   https://mannix77.github.io/2026Ignite/ios/AppStore/support.html
#   https://mannix77.github.io/2026Ignite/ios/AppStore/privacy.html
# so those two addresses must keep working. Only these two pages are published; nothing else in
# the repository (the archive of past selections in particular) goes on the site.
on:
  push:
    branches: [main]
    paths: ["ios/AppStore/*.html", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push replaces a queued one but never cuts off a deploy in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read       # configure-pages reads the site settings
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Collect the two pages at their published addresses
        run: |
          set -euo pipefail
          mkdir -p _site/ios/AppStore
          cp ios/AppStore/support.html ios/AppStore/privacy.html _site/ios/AppStore/
          # Fail here, not after the deploy, if either page is missing or empty.
          test -s _site/ios/AppStore/support.html
          test -s _site/ios/AppStore/privacy.html

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      # The Pages API sometimes answers HTTP 500 within a few seconds. Try once more after 60 s;
      # only a second failure fails the job.
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        continue-on-error: true

      - name: Wait before retrying the deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
